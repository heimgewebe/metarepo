---
name: wgx-smoke

"on":
  workflow_dispatch:
  push:
    paths:
      - ".wgx/**"
      - "docs/wgx-konzept.md"
      - ".github/workflows/wgx-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    # Compatibility filename only: verification policy is owned by Metarepo.
    uses: heimgewebe/metarepo/.github/workflows/reusable-repo-verify.yml@51cfb9f983e65a1f63a8c118aafedab4cce0875e
    with:
      mode: smoke
    permissions:
      contents: read
