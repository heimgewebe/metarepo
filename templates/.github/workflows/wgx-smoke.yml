jobs:
  smoke:
    # Compatibility filename only: verification policy is owned by Metarepo.
    uses: heimgewebe/metarepo/.github/workflows/reusable-repo-verify.yml@65db582ee20fe77c49cc052be14b4fe3349eed57
    with:
      mode: smoke
    permissions:
      contents: read
