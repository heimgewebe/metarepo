---
name: validate-agent-workflows

"on":
  push:
    paths:
      - ".agent/**/*.yml"
      - ".agent/**/*.yaml"
      - ".github/workflows/validate-agent-workflow.yml"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0

      - name: Install tools
        if: ${{ env.AGENT_MODE == '' }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install yq PyYAML
          npm i -g ajv-cli@5.0.0
      
      - name: Check tools (Agent-Mode)
        if: ${{ env.AGENT_MODE != '' }}
        run: |
          echo "Agent-Mode: skipping pip/npm install, checking dependencies"
          python3 -c "import yaml" || { echo "::error::PyYAML not available in Agent-Mode"; exit 1; }
          command -v ajv >/dev/null 2>&1 || { echo "::error::ajv-cli not available in Agent-Mode"; exit 1; }

      - name: Validate manifests (.agent/*.yml/.yaml)
        shell: bash
        env:
          SCHEMA_URL: >-
            https://raw.githubusercontent.com/heimgewebe/metarepo/contracts-v1/contracts/agent.workflow.schema.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t FILES < <(printf '%s\n' .agent/**/*.yml .agent/**/*.yaml | tr ' ' '\n' | awk 'NF')
          if (( ${#FILES[@]} == 0 )); then
            echo "::notice::Keine Agent-Workflow-Dateien unter .agent/ gefunden – übersprungen."
            exit 0
          fi
          
          # Agent-Mode: use local schema if available
          if [[ "${AGENT_MODE:-}" != "" ]]; then
            echo "Agent-Mode: using local schema instead of downloading"
            if [ -f contracts/agent.workflow.schema.json ]; then
              cp contracts/agent.workflow.schema.json /tmp/schema.json
            else
              echo "::warning::Local schema not found in Agent-Mode, skipping validation"
              exit 0
            fi
          else
            curl -fsSL "$SCHEMA_URL" -o /tmp/schema.json
          fi
          
          for f in "${FILES[@]}"; do
            echo "→ $f"
            tmp="$(mktemp /tmp/agent.XXXX.json)"
            yq -o=json '.' "$f" > "$tmp"
            ajv validate --spec=draft2020 --strict=true --validate-formats=true -s /tmp/schema.json -d "$tmp"
            rm -f "$tmp"
          done
          echo "OK."
