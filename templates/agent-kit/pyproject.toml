[project]
name = "agent-kit"
version = "0.1.0"
description = "LangGraph-basierter Agent-Skeleton für heimgewebe"
requires-python = ">=3.11"
dependencies = [
  # The template uses LangGraph directly. LangChain remains an internal transitive detail, so
  # removing the unused direct pins avoids carrying legacy prompt-loading APIs. The exact lock
  # binds patched LangChain Core and checkpoint implementations.
  "langgraph==1.2.10",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "jsonschema>=4,<5",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = [
  "orjson>=3.11.6",
  "urllib3>=2.7.0",
]
