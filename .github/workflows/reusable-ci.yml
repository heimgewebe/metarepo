---
name: reusable-ci

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

"on":
  workflow_call:
    inputs:
      run_lint:
        description: "Run linting (default: true)"
        required: false
        default: true
        type: boolean
      run_tests:
        description: "Run tests (default: true)"
        required: false
        default: true
        type: boolean
      just_version:
        description: "Exact Just version for callers without a repository-local pin"
        required: false
        default: "1.43.0"
        type: string

jobs:
  reusable-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Just from caller repository pin
        if: ${{ hashFiles('scripts/tools/just-pin.sh') != '' && hashFiles('scripts/lib/semver.sh') != '' && hashFiles('scripts/lib/installer.bash') != '' && hashFiles('toolchain.versions.yml') != '' }}
        run: |
          chmod +x scripts/tools/just-pin.sh
          scripts/tools/just-pin.sh ensure
          echo "${PWD}/tools/bin" >> "$GITHUB_PATH"

      - name: Verify preinstalled Just in Agent Mode
        if: ${{ !(hashFiles('scripts/tools/just-pin.sh') != '' && hashFiles('scripts/lib/semver.sh') != '' && hashFiles('scripts/lib/installer.bash') != '' && hashFiles('toolchain.versions.yml') != '') && env.AGENT_MODE != '' }}
        run: |
          command -v just >/dev/null
          actual_version="$(just --version | awk '{print $2}')"
          test "$actual_version" = "${{ inputs.just_version }}" || {
            echo "::error::Just version mismatch: expected ${{ inputs.just_version }}, got $actual_version"
            exit 1
          }

      - name: Setup Just fallback
        if: ${{ !(hashFiles('scripts/tools/just-pin.sh') != '' && hashFiles('scripts/lib/semver.sh') != '' && hashFiles('scripts/lib/installer.bash') != '' && hashFiles('toolchain.versions.yml') != '') && env.AGENT_MODE == '' }}
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: ${{ inputs.just_version }}

      - name: Install Dependencies (optional)
        if: ${{ env.AGENT_MODE == '' }}
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f package.json ]; then npm ci; fi

      - name: Check Dependencies (Agent-Mode)
        if: ${{ env.AGENT_MODE != '' }}
        run: |
          echo "Agent-Mode: skipping dynamic installs (pip/npm), assuming dependencies pre-installed"

      - name: Skip Justfile-dependent steps when missing Justfile
        if: ${{ hashFiles('Justfile') == '' }}
        run: echo "::notice::Kein Justfile gefunden – Just-Schritte übersprungen."

      - name: Lint
        if: ${{ inputs.run_lint == true && hashFiles('Justfile') != '' }}
        run: |
          if just --show lint >/dev/null 2>&1; then
            just lint
          else
            echo "::notice::Kein Lint-Target gefunden – übersprungen."
          fi

      - name: Test
        if: ${{ inputs.run_tests == true && hashFiles('Justfile') != '' }}
        run: |
          if just --show test >/dev/null 2>&1; then
            just test
          else
            echo "::notice::Kein Test-Target gefunden – übersprungen."
          fi

      - name: Summary
        run: echo "✅ reusable-ci completed successfully."
