name: tmp checkout pin verifier 712

# Final verification pass after all 11 reviewed stale sites were updated.
'on':
  push:
    branches:
      - renovate/actions-checkout-digest
    paths:
      - '.github/workflows/tmp-checkout-pin-repair-712.yml'

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.repository == 'heimgewebe/metarepo' && github.ref_name == 'renovate/actions-checkout-digest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Verify checkout v7 digest convergence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '9c091bb21b7c1c1d1991bb90' + '8d89e4e9dddfe3e0'
          new = 'f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a'
          helper = Path('.github/workflows/tmp-checkout-pin-repair-712.yml')
          expected_repaired = {
              '.github/workflows/agents-ci.yml',
              '.github/workflows/ci.yml',
              '.github/workflows/docs-linkcheck.yml',
              '.github/workflows/integrity-sources-release.yml',
              '.github/workflows/linkcheck.yml',
              '.github/workflows/metarepo-role-guard.yml',
              '.github/workflows/net-probe.yml',
              '.github/workflows/org-assets.yml',
              '.github/workflows/reusable-validate-observatory.yml',
              '.github/workflows/validate-templates.yml',
              'tests/test_action_ref_pinning.py',
          }

          candidates = [
              path for path in sorted(Path('.github/workflows').glob('*.yml'))
              if path != helper
          ]
          candidates += sorted(Path('templates/.github/workflows').glob('*.yml'))
          candidates += [Path('tests/test_action_ref_pinning.py')]

          stale = []
          for path in candidates:
              text = path.read_text(encoding='utf-8')
              if old in text:
                  stale.append(path.as_posix())
          if stale:
              raise SystemExit(f'old checkout-v7 digest remains: {stale}')

          missing_new = []
          for raw in sorted(expected_repaired):
              path = Path(raw)
              if new not in path.read_text(encoding='utf-8'):
                  missing_new.append(raw)
          if missing_new:
              raise SystemExit(f'expected repaired files lack canonical digest: {missing_new}')

          print('old digest absent across active workflow/template scan')
          print('all 11 previously stale files contain canonical checkout-v7 digest')
          PY
