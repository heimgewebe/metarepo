---
name: Org assets

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

"on":
  push:
    branches: [main]
    paths:
      - repos.yml
      - scripts/generate_org_assets.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/org-assets.yml
  pull_request:
    paths:
      - repos.yml
      - scripts/generate_org_assets.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/org-assets.yml

concurrency:
  group: org-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7  # v5 (major tag)
        with:
          python-version: '3.11'
      - uses: actions/cache@v6  # v6 (major tag)
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-py311-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-py311-uv-
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Verify org assets are current
        run: >-
          uv run scripts/generate_org_assets.py
          --repos-file repos.yml
          --index docs/org-index.md
          --graph docs/org-graph.mmd
          --check
