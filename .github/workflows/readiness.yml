name: fleet-readiness

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Generate readiness report only
        run: >-
          python scripts/fleet/generate_readiness.py
          --out-json reports/heimgewebe-readiness.json
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: heimgewebe-readiness
          path: reports/heimgewebe-readiness.json
