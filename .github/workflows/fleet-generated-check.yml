name: fleet-generated-check

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'fleet/repos.yml'
      - 'fleet/repo-metadata.yml'
      - 'fleet/repos.txt'
      - 'docs/repo-matrix.md'
      - 'wgx/repo_config.py'
      - 'scripts/fleet/generate_repo_matrix.py'
      - 'scripts/fleet/verify_generated_repos_txt.py'
      - '.github/workflows/fleet-generated-check.yml'
  pull_request:
    paths:
      - 'fleet/repos.yml'
      - 'fleet/repo-metadata.yml'
      - 'fleet/repos.txt'
      - 'docs/repo-matrix.md'
      - 'wgx/repo_config.py'
      - 'scripts/fleet/generate_repo_matrix.py'
      - 'scripts/fleet/verify_generated_repos_txt.py'
      - '.github/workflows/fleet-generated-check.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Verify fleet/repos.txt is generated exactly
        run: python scripts/fleet/verify_generated_repos_txt.py --source fleet/repos.yml --fleet fleet/repos.txt
      - name: Verify human-readable Fleet matrix
        run: python scripts/fleet/generate_repo_matrix.py --check
