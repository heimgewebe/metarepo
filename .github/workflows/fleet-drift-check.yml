name: fleet-drift-check

on:
  push:
    branches: [ main ]
    paths:
      - 'fleet/repos.yml'
      - 'fleet/repos.txt'
      - 'wgx/repo_config.py'
      - 'scripts/fleet/check_fleet_list.py'
      - '.github/workflows/fleet-drift-check.yml'
  pull_request:
    paths:
      - 'fleet/repos.yml'
      - 'fleet/repos.txt'
      - 'wgx/repo_config.py'
      - 'scripts/fleet/check_fleet_list.py'
      - '.github/workflows/fleet-drift-check.yml'

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Check fleet list against canonical Fleet truth
        run: python scripts/fleet/check_fleet_list.py --source fleet/repos.yml --fleet fleet/repos.txt
